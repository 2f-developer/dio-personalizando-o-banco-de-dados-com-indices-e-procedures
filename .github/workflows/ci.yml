name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Scripts e verificações
        env:
          MYSQL_PWD: root
        run: ./testar.sh -h 127.0.0.1 -P 3306 -u root
